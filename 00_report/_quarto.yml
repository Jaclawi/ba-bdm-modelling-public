format:
  # Typst PDF format (ZHAW LSFM)
  zhaw-lsfm-typst:
    typst-opts: "--root ../"
    keep-typ: true        # keep intermediate .typ for debugging — remove once numbering is fixed
    fontsize: 10pt
    papersize: a4
    columns: 2
    section-numbering: "1.1."
    number-depth: 2
    toc-depth: 2
    toc: false
    execute:
      echo: false
      warning: false
      error: true
  
  # HTML format (ZHAW LSFM)
  zhaw-lsfm-html: 
    toc: true
    number-sections: true
    execute:
      echo: false
      warning: false
      error: true
    css: 
      - zhaw-html.css

# Cross-reference settings: disable per-chapter figure numbering
crossref:
  chapters: false

# Bibliography and references
reference-section-title: References
bibliography: bibliography.bib
link-citations: true
csl: https://www.zotero.org/styles/apa

